services:
  web:
    build: .
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    expose:
      - "8000"
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.belvedere.rule=Host(`your-domain.tld`)
      - traefik.http.routers.belvedere.entrypoints=websecure
      - traefik.http.routers.belvedere.tls.certresolver=letsencrypt
      - traefik.http.services.belvedere.loadbalancer.server.port=8000

networks:
  dokploy-network:
    external: true